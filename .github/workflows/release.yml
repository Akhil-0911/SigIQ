name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package with build extras
        run: pip install -e ".[build]"

      - name: Build SigIQ.exe
        run: pyinstaller packaging/SigIQ.spec --distpath dist --workpath build

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SigIQ.exe
          generate_release_notes: true

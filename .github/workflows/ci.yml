name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run pytest-collectible test suite
        run: pytest -v

      - name: Run script-style test suite
        run: |
          python -m tests.test_pipeline_smoke
          python -m tests.test_accuracy_report

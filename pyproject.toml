[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigiq"
version = "0.1.0"
description = "Evidence-backed signal analysis workstation for .iq/.wav recordings: parameter estimation, modulation identification, demodulation, de-interleaving, FEC decoding, and bitstream correlation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akhil R", email = "rajanbabu.akhil@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "matplotlib==3.10.9",
    "reedsolo==1.7.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
build = [
    "pyinstaller==6.22.3",
    "pywin32; sys_platform == 'win32'",
]
dev = [
    "sigiq[test,build]",
]

[project.scripts]
sigiq = "sigiq.gui.app:main"

[project.urls]
Homepage = "https://github.com/Akhil-0911/SigIQ"
Repository = "https://github.com/Akhil-0911/SigIQ"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sigiq.assets" = ["*.ico", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
